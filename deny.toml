[graph]
all-features = true
# ADR-0002: Linux and macOS only, so Windows-only crates are not shipped or checked.
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["Apache-2.0", "MIT"]
# Unicode's data license, in a build-time dependency of serde_derive.
exceptions = [
  { crate = "unicode-ident", allow = ["Unicode-3.0"] },
  # Loads the display libraries at runtime on Linux, so no C library is linked.
  { crate = "libloading", allow = ["ISC"] },
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Older versions the winit and softbuffer trees need. A new duplicate still fails.
skip = [
  { crate = "bitflags@1.3.2", reason = "macOS graphics bindings under softbuffer and winit" },
  { crate = "linux-raw-sys@0.4.15", reason = "rustix 0.38" },
  { crate = "objc2@0.5.3", reason = "winit 0.30" },
  { crate = "objc2-foundation@0.2.2", reason = "winit 0.30" },
  { crate = "rustix@0.38.44", reason = "the Wayland and X11 stack" },
  { crate = "syn@2.0.119", reason = "proc macros in the window stack" },
  { crate = "thiserror@1.0.69", reason = "the Wayland and X11 stack" },
  { crate = "thiserror-impl@1.0.69", reason = "the Wayland and X11 stack" },
]
deny = [
  # ADR-0007: no async runtime in the core.
  { name = "tokio" },
  { name = "async-std" },
  { name = "smol" },
  # ADR-0005: no GUI toolkit.
  { name = "egui" },
  { name = "gtk" },
  { name = "iced" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
