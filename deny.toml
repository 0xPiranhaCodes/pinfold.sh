[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["Apache-2.0", "MIT"]

[bans]
multiple-versions = "deny"
wildcards = "deny"
deny = [
  # ADR-0007: no async runtime in the core.
  { name = "tokio" },
  { name = "async-std" },
  { name = "smol" },
  # ADR-0005: no GUI toolkit.
  { name = "egui" },
  { name = "gtk" },
  { name = "iced" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
