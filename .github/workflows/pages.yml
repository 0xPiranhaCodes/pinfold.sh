name: Pages

# Publishes site/ to GitHub Pages from main. Pull requests that touch the site only run the
# check, with read-only access. Not started by hand (#108): a deploy follows a merge to main.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml", ".github/scripts/*check-site.py"]
  pull_request:
    paths: ["site/**", ".github/workflows/pages.yml", ".github/scripts/*check-site.py"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.site.outputs.present }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/scripts
      - name: Check links, assets and origins
        run: .github/scripts/check-site.py site
      - id: site
        run: |
          if [ -d site ]; then echo "present=true"; else echo "present=false"; fi >> "$GITHUB_OUTPUT"

  build:
    if: github.event_name == 'push' && needs.check.outputs.site == 'true'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # One deploy at a time, and a queued one waits instead of cancelling a deploy mid-flight.
    concurrency:
      group: pages
      cancel-in-progress: false
    # Only this job can write, and only to Pages: the OIDC token proves the deploy came from here.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
