name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit
      - run: cargo audit
      - name: Fail on an advisory for a vendored crate, which cargo audit cannot see
        run: |
          for crate in alacritty_terminal smithay-clipboard; do
            test "$(curl -s -o /dev/null -w '%{http_code}' \
              "https://api.github.com/repos/rustsec/advisory-db/contents/crates/$crate")" = 404
          done
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install nightly-2026-10-15 --profile minimal
      # From source, because the prebuilt one defaults to a musl target that cannot sanitize.
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: FUZZ_SECONDS=1800 cargo xtask fuzz-smoke

  mem-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get install -y libxkbcommon-x11-0 xvfb
      - run: xvfb-run -a -s "-screen 0 1920x1080x24" cargo xtask mem-gate

  soak:
    runs-on: ubuntu-latest
    # An hour of soak, the build, and room for the driver's own two-minute grace.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get install -y libxkbcommon-x11-0 xvfb
      - run: xvfb-run -a -s "-screen 0 1920x1080x24" cargo xtask soak --minutes 60
