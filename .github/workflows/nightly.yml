name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-audit
      - run: cargo audit
      - name: Fail on an advisory for the vendored crate, which cargo audit cannot see
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            https://api.github.com/repos/rustsec/advisory-db/contents/crates/alacritty_terminal)" = 404
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install nightly-2026-10-15 --profile minimal
      # From source, because the prebuilt one defaults to a musl target that cannot sanitize.
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: FUZZ_SECONDS=1800 cargo xtask fuzz-smoke

  soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get install -y libxkbcommon-x11-0 xvfb
      - run: xvfb-run -a -s "-screen 0 1920x1080x24" cargo xtask mem-gate
