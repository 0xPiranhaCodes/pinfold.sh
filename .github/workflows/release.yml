name: Release (dry run)

# Dry run: builds artifacts and keeps them on the run. Nothing is published, and no step
# has write access. Signing, notarization, SBOM and publishing arrive in M5 (ADR-0016).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo build --locked --release -p pinfold-cli --bin pinfold
      - run: cargo build --locked --profile release-core -p pinfold-cli --bin pinfold-core
      - run: tar -czf "pinfold-linux-${{ matrix.arch }}.tar.gz" -C target/release pinfold -C ../release-core pinfold-core
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pinfold-linux-${{ matrix.arch }}
          path: pinfold-linux-${{ matrix.arch }}.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build universal binaries
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --locked --release --target "$target" -p pinfold-cli --bin pinfold
            cargo build --locked --profile release-core --target "$target" -p pinfold-cli --bin pinfold-core
          done
          mkdir universal
          lipo -create target/*-apple-darwin/release/pinfold -output universal/pinfold
          lipo -create target/*-apple-darwin/release-core/pinfold-core -output universal/pinfold-core
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pinfold-macos-universal
          path: universal/
