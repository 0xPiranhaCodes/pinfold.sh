[package]
name = "spike-tiered-scrollback"
description = "M0 spike: compact hot rows and compressed cold blocks on an alacritty_terminal fork."
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[dependencies]
alacritty_terminal = "=0.26.0"
libc = "0.2.191"
lz4_flex = { version = "=0.14.0", default-features = false, features = ["alloc", "checked-decode", "safe-decode", "safe-encode"] }

# setup.sh creates this from the published crate plus grid-eviction.patch.
[patch.crates-io]
alacritty_terminal = { path = "vendor/alacritty_terminal" }

[profile.release]
debug = false

# Throwaway spike code, kept out of the product workspace (ADR-0019).
[workspace]
