[package]
name = "pinfold-tools"
description = "Markdown reader, file manager and diff viewer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
pinfold-api = { path = "../pinfold-api", version = "0.1.0-beta.5" }
pinfold-sys = { path = "../pinfold-sys", version = "0.1.0-beta.5" }
pulldown-cmark = { version = "0.13.6", default-features = false }
serde_json = "1.0.154"
# Git's blob ids, so a checkpoint's readers name blobs without asking git (ADR-0050).
sha1 = { version = "0.11.0", default-features = false }
similar = { version = "3.2.1", default-features = false, features = ["std"] }
unicode-width = "0.2.3"

[lints]
workspace = true

[dev-dependencies]
insta = { version = "1.49.0", default-features = false }
pinfold-testkit = { path = "../pinfold-testkit", version = "0.1.0-beta.5" }
