[package]
name = "pinfold-core"
description = "Core daemon library: PTY, VT engine, mux, sessions and status engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
alacritty_terminal = "=0.26.0"
# The safe features make the crate forbid unsafe code. Off by default: its frame format.
lz4_flex = { version = "=0.14.0", default-features = false, features = ["alloc", "checked-decode", "safe-decode", "safe-encode"] }
mio = { version = "1.2.4", features = ["os-ext", "os-poll"] }
pinfold-api = { path = "../pinfold-api", version = "0.1.0-beta.1" }
pinfold-mux = { path = "../pinfold-mux", version = "0.1.0-beta.1" }
pinfold-proto = { path = "../pinfold-proto", version = "0.1.0-beta.1" }
pinfold-sys = { path = "../pinfold-sys", version = "0.1.0-beta.1" }
# Linear-time matching for `pane.wait` patterns. Not `regex`, whose engines and Unicode tables
# add about 0.6 MB to the core's resident size on Linux; the cost is ASCII-only classes.
regex-lite = "0.1.9"
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
# Off by default: coloured diffs, which pull in `console`.
insta = { version = "1.49.0", default-features = false }
proptest = "1.12.0"

[lints]
workspace = true
