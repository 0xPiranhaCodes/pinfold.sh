[package]
name = "pinfold-render"
description = "Renderer trait, CPU renderer and glyph cache."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
pinfold-proto = { path = "../pinfold-proto", version = "0.0.0" }
raw-window-handle = "0.6.2"
softbuffer = { version = "=0.4.8", default-features = false, features = ["wayland", "wayland-dlopen", "x11", "x11-dlopen"] }
pinfold-sys = { path = "../pinfold-sys", version = "0.0.0", features = ["metal"] }
swash = "=0.2.10"
thiserror = "2.0.21"
unicode-width = "0.2.3"

[lints]
workspace = true
