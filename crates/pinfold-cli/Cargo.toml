[package]
name = "pinfold-cli"
description = "The pinfold, pinfold-core and pinfold-window binaries."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

# doc = false: the pinfold-core bin would collide with the pinfold-core lib's docs.
[[bin]]
name = "pinfold"
path = "src/bin/pinfold.rs"
doc = false

[[bin]]
name = "pinfold-core"
path = "src/bin/pinfold-core.rs"
doc = false

[[bin]]
name = "pinfold-window"
path = "src/bin/pinfold-window.rs"
doc = false
required-features = ["window"]

# Build pinfold-core with --no-default-features, so the window stack is not linked into it.
[features]
default = ["window"]
window = ["dep:pinfold-ui"]

[dependencies]
pinfold-ui = { path = "../pinfold-ui", version = "0.1.0-beta.4", optional = true }
pinfold-api = { path = "../pinfold-api", version = "0.1.0-beta.4" }
pinfold-config = { path = "../pinfold-config", version = "0.1.0-beta.4" }
pinfold-core = { path = "../pinfold-core", version = "0.1.0-beta.4" }
pinfold-proto = { path = "../pinfold-proto", version = "0.1.0-beta.4" }
pinfold-sys = { path = "../pinfold-sys", version = "0.1.0-beta.4" }
pinfold-tools = { path = "../pinfold-tools", version = "0.1.0-beta.4" }
serde_json = "1.0.154"

[dev-dependencies]
# Off by default, as in pinfold-core: coloured diffs pull in `console`.
insta = { version = "1.49.0", default-features = false }
pinfold-ui = { path = "../pinfold-ui", version = "0.1.0-beta.4" }

[lints]
workspace = true
