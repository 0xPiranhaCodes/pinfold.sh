[package]
name = "pinfold-cli"
description = "The pinfold and pinfold-core binaries."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

# doc = false: the pinfold-core bin would collide with the pinfold-core lib's docs.
[[bin]]
name = "pinfold"
path = "src/bin/pinfold.rs"
doc = false

[[bin]]
name = "pinfold-core"
path = "src/bin/pinfold-core.rs"
doc = false

[dependencies]
pinfold-ui = { path = "../pinfold-ui", version = "0.0.0" }
pinfold-core = { path = "../pinfold-core", version = "0.0.0" }

[lints]
workspace = true
