[package]
name = "pinfold-cli"
description = "The pinfold and pinfold-core binaries."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

# doc = false: the pinfold-core bin would collide with the pinfold-core lib's docs.
[[bin]]
name = "pinfold"
path = "src/bin/pinfold.rs"
doc = false
required-features = ["window"]

[[bin]]
name = "pinfold-core"
path = "src/bin/pinfold-core.rs"
doc = false

# Build pinfold-core with --no-default-features, so the window stack is not linked into it.
[features]
default = ["window"]
window = ["dep:pinfold-ui"]

[dependencies]
pinfold-ui = { path = "../pinfold-ui", version = "0.0.0", optional = true }
pinfold-api = { path = "../pinfold-api", version = "0.0.0" }
pinfold-core = { path = "../pinfold-core", version = "0.0.0" }
pinfold-sys = { path = "../pinfold-sys", version = "0.0.0" }

[dev-dependencies]
serde_json = "1.0.154"

[lints]
workspace = true
