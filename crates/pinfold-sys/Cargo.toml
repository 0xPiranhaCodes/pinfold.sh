[package]
name = "pinfold-sys"
description = "FFI and libc calls: the only crate allowed unsafe code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
libc = "0.2.191"

[features]
# Off in the core, so it never loads Apple's graphics frameworks.
metal = [
  "dep:objc2",
  "dep:objc2-foundation",
  "dep:objc2-metal",
  "dep:objc2-quartz-core",
  "dep:raw-window-handle",
]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", optional = true }
objc2-foundation = { version = "0.3.2", optional = true }
objc2-metal = { version = "0.3.2", optional = true }
objc2-quartz-core = { version = "0.3.2", optional = true }
raw-window-handle = { version = "0.6.2", optional = true }

# A crate cannot relax an inherited `forbid`, so this mirrors [workspace.lints].
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
todo = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
