[package]
name = "pinfold-sys"
description = "FFI and libc calls: the only crate allowed unsafe code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
copypasta = { version = "0.10.2", optional = true }
libc = "0.2.191"
raw-window-handle = { version = "0.6.2", optional = true }
# Its safe self-pipe handler, already built for alacritty_terminal. Off by default: its
# channel and iterator, which the core does not use.
signal-hook = { version = "0.4.6", default-features = false }

[features]
# Off in the core, which never touches the clipboard.
clipboard = ["dep:copypasta", "dep:raw-window-handle", "dep:x11-clipboard", "dep:x11rb"]
# The macOS menu bar. Off in the core, which has no window.
menu = ["dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]
# Off in the core, so it never loads Apple's graphics frameworks.
metal = [
  "dep:objc2",
  "dep:objc2-foundation",
  "dep:objc2-metal",
  "dep:objc2-quartz-core",
  "dep:raw-window-handle",
]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", optional = true }
objc2-app-kit = { version = "0.3.2", optional = true, default-features = false, features = [
  "std",
  "NSApplication",
  "NSEvent",
  "NSMenu",
  "NSMenuItem",
  "NSResponder",
] }
objc2-foundation = { version = "0.3.2", optional = true }
objc2-metal = { version = "0.3.2", optional = true }
objc2-quartz-core = { version = "0.3.2", optional = true }

# Only `appkit_reads_a_whole_pasteboard`, which measures what the clipboard avoids.
# The versions copypasta already builds, for a clipboard read within a limit (#310).
[target.'cfg(not(target_os = "macos"))'.dependencies]
x11-clipboard = { version = "0.9.3", optional = true }
x11rb = { version = "0.13.2", optional = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = "0.3.2"

[[test]]
name = "dock_menu"
harness = false
required-features = ["menu"]

# A crate cannot relax an inherited `forbid`, so this mirrors [workspace.lints].
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
todo = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
