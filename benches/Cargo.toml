[package]
name = "pinfold-benches"
description = "Latency and throughput benches."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[[bin]]
name = "scrollback"
path = "scrollback.rs"

[[bin]]
name = "read"
path = "read.rs"

[[bin]]
name = "echo"
path = "echo.rs"

[dependencies]
alacritty_terminal = "=0.26.0"
pinfold-api = { path = "../crates/pinfold-api", version = "0.1.0-beta.1" }
pinfold-core = { path = "../crates/pinfold-core", version = "0.1.0-beta.1" }
pinfold-proto = { path = "../crates/pinfold-proto", version = "0.1.0-beta.1" }
pinfold-sys = { path = "../crates/pinfold-sys", version = "0.1.0-beta.1" }
pinfold-ui = { path = "../crates/pinfold-ui", version = "0.1.0-beta.1" }

[lints]
workspace = true
