[package]
name = "pinfold-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[[bin]]
name = "vt_input"
path = "fuzz_targets/vt_input.rs"
test = false
doc = false
bench = false

[[bin]]
name = "paste"
path = "fuzz_targets/paste.rs"
test = false
doc = false
bench = false

[[bin]]
name = "link"
path = "fuzz_targets/link.rs"
test = false
doc = false
bench = false

[[bin]]
name = "api_request"
path = "fuzz_targets/api_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "api_params"
path = "fuzz_targets/api_params.rs"
test = false
doc = false
bench = false

[[bin]]
name = "session_snapshot"
path = "fuzz_targets/session_snapshot.rs"
test = false
doc = false
bench = false

[[bin]]
name = "workspace_layout"
path = "fuzz_targets/workspace_layout.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config"
path = "fuzz_targets/config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ghostty_theme"
path = "fuzz_targets/ghostty_theme.rs"
test = false
doc = false
bench = false

[[bin]]
name = "itermcolors"
path = "fuzz_targets/itermcolors.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tool_keys"
path = "fuzz_targets/tool_keys.rs"
test = false
doc = false
bench = false

[[bin]]
name = "markdown"
path = "fuzz_targets/markdown.rs"
test = false
doc = false
bench = false

[[bin]]
name = "unified_diff"
path = "fuzz_targets/unified_diff.rs"
test = false
doc = false
bench = false

[dependencies]
libfuzzer-sys = "0.4"
pinfold-api = { path = "../crates/pinfold-api" }
pinfold-config = { path = "../crates/pinfold-config" }
pinfold-core = { path = "../crates/pinfold-core" }
pinfold-mux = { path = "../crates/pinfold-mux" }
pinfold-proto = { path = "../crates/pinfold-proto" }
pinfold-tools = { path = "../crates/pinfold-tools" }

# Keeps this out of the workspace, so the C++ in libfuzzer-sys stays out of its builds.
[workspace]

# `[patch]` is per workspace, so the fork needs naming here too.
[patch.crates-io]
alacritty_terminal = { path = "../vendor/alacritty_terminal" }
