[[audits.lz4_flex]]
who = "Satheesh Kumar <22219814+0xPiranhaCodes@users.noreply.github.com>"
criteria = "safe-to-deploy"
version = "0.14.0"
notes = "AI-assisted review (Claude Code) for the maintainer; not yet spot-checked by a person. Pinfold builds it with safe-decode and safe-encode, which compile out fastcpy_unsafe.rs and block/decompress.rs and put forbid(unsafe_code) on the encoder, safe decoder and sink. Read the safe block decoder in full: every input read uses get or a length check, and every output write is preceded by a capacity check, so malformed input returns an error rather than panicking. Also read the unsafe block decoder: its bounds checks are unconditional in this version and cover literal, offset and match lengths before each pointer copy. Read the unsafe encoder's pointer reads and writes but did not prove the end-of-input margins they rely on. No build script, I/O or FFI. decompress and decompress_size_prepended allocate a caller-given or header-given size; Pinfold uses decompress_into and caps the header size at MAX_INFLATED (pinfold-core scrollback.rs)."

[[audits.objc-sys]]
who = "Satheesh Kumar <22219814+0xPiranhaCodes@users.noreply.github.com>"
criteria = "safe-to-deploy"
version = "0.3.5"
notes = "AI-assisted review (Claude Code) for the maintainer; not yet spot-checked by a person. Raw bindings to the Objective-C runtime. build.rs reads only TARGET, CARGO_CFG_*, CARGO_FEATURE_* and DOCS_RS, emits link and cfg lines (dylib objc on Apple), and runs cc only for the unstable-exception feature, which Pinfold does not enable. src is extern declarations, type aliases and constants; the only unsafe blocks are in tests. Did not check each extern signature against Apple's headers."

[[audits.sha2]]
who = "Satheesh Kumar <22219814+0xPiranhaCodes@users.noreply.github.com>"
criteria = "safe-to-deploy"
version = "0.11.1"
notes = "AI-assisted review (Claude Code) for the maintainer; not yet spot-checked by a person. Pinfold hashes API tokens with it. Read the dispatch in sha256.rs and sha512.rs and every unsafe block in the x86 SHA-NI and AVX2 backends, the aarch64 SHA2 and SHA3 backends and the soft round-constant reads. The intrinsics run only after a cpufeatures check or a compile-time target_feature, and every load and store is an unaligned intrinsic on a fixed-size array reference, in bounds by type. The RISC-V and LoongArch asm backends, which Pinfold does not build, only load from the block and constant arrays they are given. No build script, I/O or FFI."

[[audits.signal-hook]]
who = "Satheesh Kumar <22219814+0xPiranhaCodes@users.noreply.github.com>"
criteria = "safe-to-deploy"
version = "0.4.6"
notes = "AI-assisted review (Claude Code) for the maintainer; not yet spot-checked by a person. Read every unsafe block in src. build.rs compiles src/low_level/extract.c with cc only under the extended-siginfo-raw feature, which Pinfold does not enable; the C reads si_code, si_pid and si_uid from a kernel siginfo_t. The lock-free channel indexes five UnsafeCell slots by 3-bit indices handed out once by CAS on two AtomicU16 queues. The rest wraps sigaction, raise, abort, _exit, fcntl, send, write and recv on owned fds with checked returns, and fills a MaybeUninit slot array with ptr::write before assume_init. add_signal asserts on signal numbers, which come from the caller, not from input. No file, network or environment access."

[[audits.signal-hook-registry]]
who = "Satheesh Kumar <22219814+0xPiranhaCodes@users.noreply.github.com>"
criteria = "safe-to-deploy"
delta = "1.4.1 -> 1.4.8"
notes = "AI-assisted review (Claude Code) for the maintainer; not yet spot-checked by a person. Replaces static mut GLOBAL_DATA with an AtomicPtr set once from Box::into_raw, swaps HashMap/BTreeMap for an insertion-ordered VecMap, saves and restores errno around the handler, and casts handler pointers through *const () for provenance. Adds the errno dependency. No new syscalls or I/O."

[[audits.smithay-clipboard]]
who = "Satheesh Kumar <22219814+0xPiranhaCodes@users.noreply.github.com>"
criteria = "safe-to-deploy"
version = "0.7.2"
notes = "AI-assisted review (Claude Code) for the maintainer; not yet spot-checked by a person. Read lib.rs, state.rs, worker.rs and mime.rs. Unsafe: Clipboard::new trusts the caller's wl_display pointer, set_non_blocking wraps fcntl with checked returns, and two calloop Generic get_mut calls only read from or write to the pipe they own. The read loop appends another client's offer to a Vec with no cap, so a hostile selection owner can grow the window process's memory; the from_utf8 unwrap follows a from_utf8_lossy Borrowed check and cannot fail. libwayland-client is loaded by wayland-sys (dlopen feature), not read here. No build script."

