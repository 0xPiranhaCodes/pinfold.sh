
# cargo-vet audits file

[[audits.arrayvec]]
who = "Satheesh Kumar <22219814+0xPiranhaCodes@users.noreply.github.com>"
criteria = "safe-to-deploy"
delta = "0.7.6 -> 0.7.8"
notes = "AI-assisted review (Claude Code) for the maintainer; not yet spot-checked by a person. Adds spare_capacity_mut (a safe slice of the MaybeUninit tail), fixes a ZST double drop in extend with mem::forget, a 16-bit length type, and lifetime elisions. No new unsafe beyond the existing set_len contract."

[[audits.block-buffer]]
who = "Satheesh Kumar <22219814+0xPiranhaCodes@users.noreply.github.com>"
criteria = "safe-to-deploy"
version = "0.12.1"
notes = "AI-assisted review (Claude Code) for the maintainer; not yet spot-checked by a person. Read every unsafe block in lib.rs, read.rs and sealed.rs. The buffer is a MaybeUninit block whose initialised prefix length is kept below the block size (eager, stored in the last byte) or at most the block size (lazy); every copy_nonoverlapping, set_pos_unchecked and slice::from_raw_parts first checks that invariant or derives the length from it, and a reset guard restores it if the compress callback panics. deserialize validates the position byte and zero tail. No build script, I/O or FFI."

