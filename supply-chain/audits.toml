[[audits.hybrid-array]]
who = "Satheesh Kumar <22219814+0xPiranhaCodes@users.noreply.github.com>"
criteria = "safe-to-deploy"
version = "0.4.15"
notes = "AI-assisted review (Claude Code) for the maintainer; not yet spot-checked by a person. Read every unsafe block. They are pointer casts between the repr(transparent) Array and [T; N] or slices, each after a length check (slice_as_array, TryFrom, slice_as_chunks) or with sizes fixed by typenum bounds (split needs U: Sub<N>, flatten needs exact products), plus a drop guard in try_from_fn that drops only the initialised prefix. The ArraySize impls are generated by a macro that also emits a USIZE == len test. No build script, I/O or FFI."

