[[audits.unicase]]
who = "Satheesh Kumar <22219814+0xPiranhaCodes@users.noreply.github.com>"
criteria = "safe-to-deploy"
delta = "2.8.1 -> 2.10.0"
notes = "AI-assisted review (Claude Code) for the maintainer; not yet spot-checked by a person. Read the whole delta from mozilla's 2.6.0 -> 2.8.1 audit: Unicode 17 case-fold table entries, Ascii ordering by bytes rather than chars, the third character of a three-character fold returned in order, and a hand-written UTF-8 encoder replaced by char::encode_utf8. No unsafe, build script, I/O or FFI."

[[audits.vte]]
who = "Satheesh Kumar <22219814+0xPiranhaCodes@users.noreply.github.com>"
criteria = "safe-to-deploy"
version = "0.15.0"
notes = "AI-assisted review (Claude Code) for the maintainer; not yet spot-checked by a person. Parses untrusted PTY output in the core. Read lib.rs and params.rs in full and ansi.rs for unsafe, I/O and panics. Five unsafe blocks, all in lib.rs: from_utf8_unchecked on prefixes str::from_utf8 already validated, and the OSC param array, whose count is capped at MAX_OSC_PARAMS before the slice cast. ansi.rs is safe code with no file, network or process access. With std the OSC buffer has no length limit; pinfold-core caps OSC strings before they reach the parser (vt.rs, an_unending_osc_string_stops_at_the_limit)."

[[audits.x11-clipboard]]
who = "Satheesh Kumar <22219814+0xPiranhaCodes@users.noreply.github.com>"
criteria = "safe-to-deploy"
version = "0.9.3"
notes = "AI-assisted review (Claude Code) for the maintainer; not yet spot-checked by a person. Read lib.rs and run.rs in full. Two unsafe blocks: pipe2 with a checked return wrapped in OwnedFd, and poll on a stack array with its own length. Clipboard data from another X client is untrusted: an INCR reply's size is passed to Vec::reserve and the INCR transfer has no length cap, so a hostile owner can make the window process allocate without bound or abort within the caller's timeout. run.rs computes value.len() - state.pos, which can underflow if the stored value shrinks mid-transfer. Both are reachable only in the window process, never the core. No build script or file access."

