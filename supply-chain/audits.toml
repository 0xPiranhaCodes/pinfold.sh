[[audits.const-oid]]
who = "Satheesh Kumar <22219814+0xPiranhaCodes@users.noreply.github.com>"
criteria = "safe-to-deploy"
version = "0.10.2"
notes = "AI-assisted review (Claude Code) for the maintainer; not yet spot-checked by a person. deny(unsafe_code) with one allowed block: a cast from [u8] to the repr(transparent) ObjectIdentifierRef in a pub(crate) constructor whose public caller first walks the arcs to validate the BER encoding. Pinfold only uses its fixed digest OIDs through sha2. No build script, I/O or FFI."

[[audits.copypasta]]
who = "Satheesh Kumar <22219814+0xPiranhaCodes@users.noreply.github.com>"
criteria = "safe-to-deploy"
version = "0.10.2"
notes = "AI-assisted review (Claude Code) for the maintainer; not yet spot-checked by a person. Read the macOS, X11 and Wayland providers in full; the Windows provider does not build for Pinfold. The macOS provider sends objc2 messages to a retained NSPasteboard and checks nil returns, except types().unwrap(), which panics in the window process if the pasteboard returns nil; it also marks the context Send and Sync, so callers must keep it on one thread. The Wayland provider's create_clipboards_from_external is unsafe and trusts the caller's wl_display pointer. No build script, file, network or process access."

[[audits.core-graphics]]
