criteria = "safe-to-deploy"
delta = "0.24.0 -> 0.23.2"
notes = "AI-assisted review (Claude Code) for the maintainer; not yet spot-checked by a person. Backwards delta from the mozilla-audited 0.24.0; read the whole diff. 0.23.2 lacks the display reconfiguration callback, the CGFont metric getters and their extern declarations, uses bitflags 1 and core-foundation 0.9 through macro_use, and calls CGGetActiveDisplayList with a buffer sized to the count it passes and a null out-count. kCGWindowSharingReadWrite is 1 here (0.24.0 corrects it to 2); a wrong constant, not a memory-safety issue. No new unsafe, build script or I/O."

