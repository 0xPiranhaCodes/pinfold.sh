[[exemptions.yazi]]
version = "0.2.1"
criteria = "safe-to-deploy"
notes = "Kept by Satheesh Kumar because it has no unsafe, but swash uses it to inflate PNG glyph bitmaps from font files and its Vec sink has no output cap; allocation limits were not checked. Review in #302."

[[exemptions.zeno]]
version = "0.3.3"
criteria = "safe-to-deploy"
notes = "Kept by Satheesh Kumar because raster.rs to_fixed calls f32::to_int_unchecked, which is undefined behaviour for NaN, infinite or out-of-range values. Mask shifts points by their bounds before to_fixed, so only the extent and non-finite points matter; pinfold-render measures every glyph first and rejects non-finite outlines and extents past its cells (glyphs.rs finite, #310). Review in #302."

